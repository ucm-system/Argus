# GitHub Pages：发布 landing/ 落地页
#
# 首次使用前需在仓库 Settings → Pages 把 Source 改为 "GitHub Actions"。
# 之后每次 main 上 landing/ 变更（或手动触发）都会自动部署。
# 预览地址：https://ucm-system.github.io/Argus/
name: pages

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
