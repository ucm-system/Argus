name: AISBench Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签；留空使用各自 runner.yaml 的 version（例如 0.3.5）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize manual publishes so concurrent runs cannot interleave shared tags.
concurrency:
  group: aisbench-dockerhub-publish
  cancel-in-progress: false

jobs:
  source:
    name: Resolve temp source commit
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout temp
        uses: actions/checkout@v4
        with:
          ref: refs/heads/temp
      - name: Record source commit
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish ${{ matrix.runner }}
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [aisbench-acc, aisbench-perf]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Prepare image tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
          AISBENCH_RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::请配置仓库 Actions Secrets：DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN'
            exit 1
          fi
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo '::error::DOCKERHUB_USERNAME 应为 Docker Hub 用户名，不包含 URL 或斜杠'
            exit 1
          fi
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(sed -n 's/^version: *//p' "runners/$AISBENCH_RUNNER/runner.yaml" | tr -d '\r')"
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || "$tag" == latest || "$tag" == sha-* ]]; then
            echo '::error::tag 必须为有效 Docker 标签；latest 和 sha- 前缀保留，不能手动指定'
            exit 1
          fi
          image="docker.io/$DOCKERHUB_USERNAME/argus-runner-$AISBENCH_RUNNER"
          source_sha="$(git rev-parse HEAD)"
          {
            echo "IMAGE=$image"
            echo "IMAGE_TAG=$tag"
            echo "SOURCE_SHA=$source_sha"
            echo "SHA_TAG=sha-$source_sha"
          } >> "$GITHUB_ENV"
          {
            echo 'tags<<TAGS'
            echo "$image:$tag"
            echo "$image:sha-$source_sha"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load image
        uses: docker/build-push-action@v7
        with:
          context: runners/${{ matrix.runner }}
          file: runners/${{ matrix.runner }}/build/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
          cache-from: type=gha,scope=dockerhub-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=dockerhub-${{ matrix.runner }}

      - name: Check entrypoint and run AISBench smoke test
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm --init --read-only \
            --tmpfs /tmp:rw,exec,size=4g --shm-size=1g \
            "$IMAGE:$IMAGE_TAG" --help
          docker run --rm --init --read-only \
            --tmpfs /tmp:rw,exec,size=4g --shm-size=1g \
            --entrypoint python3 "$IMAGE:$IMAGE_TAG" /runner/tests/real_smoke.py

      - name: Push tested image and write summary
        run: |
          set -euo pipefail
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$SHA_TAG"
          digest="$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          {
            echo "### $IMAGE"
            echo
            echo "- Version tag: \`$IMAGE:$IMAGE_TAG\`"
            echo "- Commit tag: \`$IMAGE:$SHA_TAG\`"
            echo "- Source: \`temp\` at \`$SOURCE_SHA\`"
            echo "- Digest: \`$digest\`"
            echo '- Platform: `linux/amd64`'
            echo '- Entrypoint and AISBench mock-service smoke test passed.'
            echo
            echo 'Pull this tested image:'
            echo '```bash'
            echo "docker pull $digest"
            echo '```'
            echo 'Platform runner.yaml image (update the runner version when changing its manifest):'
            echo '```yaml'
            echo "image: $digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
