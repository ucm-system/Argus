name: AISBench Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签；留空使用各自 runner.yaml 的 version（例如 0.3.6）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize manual publishes so concurrent runs cannot interleave shared tags.
concurrency:
  group: aisbench-dockerhub-publish
  cancel-in-progress: false

jobs:
  source:
    name: Resolve temp source commit
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout temp
        uses: actions/checkout@v4
        with:
          ref: refs/heads/temp
      - name: Record source commit
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test ${{ matrix.runner }} (${{ matrix.platform.arch }})
    needs: source
    runs-on: ${{ matrix.platform.host }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [aisbench-acc, aisbench-perf]
        platform:
          - arch: amd64
            host: ubuntu-22.04
          - arch: arm64
            host: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Prepare image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
          AISBENCH_RUNNER: ${{ matrix.runner }}
          AISBENCH_ARCH: ${{ matrix.platform.arch }}
        run: python3 .github/scripts/aisbench_image.py meta

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load image
        uses: docker/build-push-action@v7
        with:
          context: runners/${{ matrix.runner }}
          file: runners/${{ matrix.runner }}/build/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.STAGING_TAG }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
          cache-from: type=gha,scope=dockerhub-${{ matrix.runner }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=dockerhub-${{ matrix.runner }}-${{ matrix.platform.arch }}

      - name: Check entrypoint and run AISBench smoke test
        timeout-minutes: 10
        env:
          EXPECTED_PLATFORM: linux/${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          actual="$(docker image inspect "$IMAGE:$STAGING_TAG" --format '{{.Os}}/{{.Architecture}}')"
          test "$actual" = "$EXPECTED_PLATFORM"
          docker run --rm --init --read-only \
            --tmpfs /tmp:rw,exec,size=4g --shm-size=1g \
            "$IMAGE:$STAGING_TAG" --help
          docker run --rm --init --read-only \
            --tmpfs /tmp:rw,exec,size=4g --shm-size=1g \
            --entrypoint python3 "$IMAGE:$STAGING_TAG" /runner/tests/real_smoke.py

      - name: Push tested platform image
        run: |
          set -euo pipefail
          docker push "$IMAGE:$STAGING_TAG"
          ref="$(docker image inspect "$IMAGE:$STAGING_TAG" --format '{{index .RepoDigests 0}}')"
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-digest
          printf '%s\n' "$digest" > image-digest/digest.txt

      - name: Upload tested digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}-${{ matrix.platform.arch }}
          path: image-digest/digest.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish multi-platform ${{ matrix.runner }}
    needs: [source, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [aisbench-acc, aisbench-perf]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Prepare final tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
          AISBENCH_RUNNER: ${{ matrix.runner }}
        run: python3 .github/scripts/aisbench_image.py meta

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.runner }}-amd64
          path: digests/amd64
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.runner }}-arm64
          path: digests/arm64

      - name: Assemble and verify tested index
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            digest="$(cat "digests/$arch/digest.txt")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$INDEX_TAG" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$INDEX_TAG" --format '{{json .Manifest}}' > index.json
          digest="$(python3 .github/scripts/aisbench_image.py verify-index index.json digests)"
          echo "INDEX_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Publish final tags and write summary
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$IMAGE_TAG" --tag "$IMAGE:$SHA_TAG" "$IMAGE@$INDEX_DIGEST"
          for tag in "$IMAGE_TAG" "$SHA_TAG"; do
            docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' > published.json
            digest="$(python3 .github/scripts/aisbench_image.py verify-index published.json digests)"
            test "$digest" = "$INDEX_DIGEST"
          done
          {
            echo "### $IMAGE"
            echo
            echo "- Version tag: \`$IMAGE:$IMAGE_TAG\`"
            echo "- Commit tag: \`$IMAGE:$SHA_TAG\`"
            echo "- Source: \`temp\` at \`$SOURCE_SHA\`"
            echo "- Index digest: \`$IMAGE@$INDEX_DIGEST\`"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
            echo '- Entrypoint and AISBench mock-service smoke test passed on both native architectures.'
            echo
            echo 'Pull this tested image:'
            echo '```bash'
            echo "docker pull $IMAGE@$INDEX_DIGEST"
            echo '```'
            echo 'Platform runner.yaml image (update the runner version when changing its manifest):'
            echo '```yaml'
            echo "image: $IMAGE@$INDEX_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
