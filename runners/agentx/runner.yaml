name: agentx
version: 1.0.14
display_name: AgentX 长上下文 agentic 压测
description: |
  用 SemiAnalysis InferenceX 的真实 agentic coding trace 语料（393 条 Claude Code 会话，含
  subagent 分支，约 1.85GB）回放压测被测服务：按录制的时间间隔重放每一轮请求、保留会话前缀以
  复用服务端 KV cache，输出 TTFT / ITL / 端到端时延 / token 吞吐与前缀缓存命中率。

  被测服务地址、模型名与分词器是公共参数，由平台注入，不写进输入文件：
  AG_SERVED_URL / AG_SERVED_MODEL_NAME / AG_MODEL_PATH。分词器通常指向容器内的模型权重
  或分词器目录（如 /models/Qwen3-32B）；不注入时按模型名向 HuggingFace 推导，离线环境会失败。

  语料默认取公开数据集，需要能访问 HuggingFace；离线运行请用 dataset_dir 指向本地语料目录，
  并打开 offline=true。首次运行包含语料下载与 token 化重建，冷启动明显慢于 benchmark 时长本身。

role: test
on_failure: continue
entry: ["/runner/run.sh"]
input_format: jsonl
image: registry.dev.huawei.com/argus/agentx:latest

resources:
  cpu: "4"
  memory: "8Gi"
  gpu: { resource: nvidia.com/gpu, count: 0 }

concurrency:
  endpoint_exclusive: true

mounts: []
exports: []
consumes: [AG_SERVED_URL, AG_SERVED_MODEL_NAME]

placeholder: '{"concurrency":8,"benchmark_duration_seconds":1800,"dataset_dir": "cc_traces_weka_062126","random_seed":42, "max_context_length": 0}'

parameters:
  - name: concurrency
    type: integer
    required: false
    default: 8
    description: |
      并发会话树数量（subagent 分支并行时在飞请求数可超过它）。生产压测推荐 8~64。

  - name: benchmark_duration_seconds
    type: integer
    required: false
    default: 1800
    description: |
      测量时长（秒）。scenario 下限 900 秒，低于它需同时打开 allow_short_run。
      正式对比推荐 1800，需要更长稳态时用 3600。

  - name: dataset_dir
    type: string
    required: false
    default: ""
    description: |
      本地语料目录（离线用）：写数据集名（相对平台挂载的 /data，如 cc-traces）或绝对路径，
      指向 traces.jsonl 的父目录而不是文件本身。目录需可写（Runner 会在其中生成 .agentx-split/）；
      只想只读挂载就预先放好拆好的 *.json。设置后不再使用 public_dataset，结果固定
      submission_valid=false，不可与公开语料的运行比较。
    example: cc_traces_weka_062126-256k

  - name: max_context_length
    type: integer
    required: false
    default: 0
    description: |
      客户端上下文过滤：丢掉超过该 token 数的 trace，0 = 不过滤。
      推荐填被测服务真实的最大上下文，例如 128000。

  - name: public_dataset
    type: string
    required: false
    default: semianalysis_cc_traces_weka_062126
    description: |
      Weka agentic trace 语料别名。推荐保持默认的 date-pinned 别名
      semianalysis_cc_traces_weka_062126（393 条会话，1.85GB，公开无鉴权）；
      上下文窗口约 256k 的服务用 _256k 变体。滚动别名会随语料更新而变化，两次运行不可比。

  - name: num_dataset_entries
    type: integer
    required: false
    default: 0
    description: |
      只回放语料前 N 条 trace，0 = 全量 393 条。仅用于冒烟，不要用于需要对比或提交的数据。

  - name: random_seed
    type: integer
    required: false
    default: 42
    description: |
      随机种子，决定每条 lane 的起始 turn 与回绕顺序，也是数据集重建缓存的 key。
      需要复现或复用上次缓存时保持默认 42。

  - name: scenario
    type: string
    required: false
    default: agentx
    description: |
      AgentX 场景：agentx（默认，3600 秒时长、0~100% 起始窗口）或
      inferencex-agentx-mvp（1800 秒、25%~75% 起始窗口）。两者的结果不可直接比较。
    example: agentx

  - name: warmup_requests_per_lane
    type: integer
    required: false
    default: 0
    description: |
      每个并发 lane 额外的预热请求数，0 = 用 scenario 默认。与 agentic_cache_warmup_duration 互斥。

  - name: agentic_cache_warmup_duration
    type: integer
    required: false
    default: 0
    description: |
      时长制缓存预热（秒），0 = 关闭。与 warmup_requests_per_lane 互斥。

  - name: allow_short_run
    type: boolean
    required: false
    default: false
    description: |
      放行 benchmark_duration_seconds < 900 的短跑，结果固定 submission_valid=false。
      仅用于冒烟与消融，不要用于需要对比的数据。

  - name: offline
    type: boolean
    required: false
    default: true
    description: |
      完全不出网：true 时任何 HuggingFace 访问都会立刻失败。
      离线运行（本地语料 + 本地分词器）推荐打开。

  - name: hf_cache_dir
    type: string
    required: false
    default: ""
    description: |
      HuggingFace 缓存目录（可写）。缺省 <output>/.cache/hf，跑完删除；
      想跨 attempt 复用 1.85GB 语料时指向可写 PVC。
    example: /data/agentx-hf

  - name: mmap_cache_dir
    type: string
    required: false
    default: ""
    description: |
      数据集重建缓存目录（可写）。缺省 <output>/.cache/mmap，跑完删除；
      想跨 attempt 复用重建结果时指向可写 PVC。
    example: /data/agentx-mmap

  - name: keep_cache
    type: boolean
    required: false
    default: false
    description: |
      保留 <output>/.cache（默认删除）。仅排查问题时打开：约 2GB 缓存会计入 attempt 产物。

  - name: agentx_cmd
    type: string
    required: false
    default: agentx
    description: |
      替换 agentx 命令，默认用镜像自带的 agentx。
      离线回归填：python3 /runner/tests/stub_agentx.py

  - name: extra_args
    type: string
    required: false
    default: ""
    description: |
      追加到 agentx profile 末尾的原始参数串，例如 "--use-server-token-count"。
      不要用它覆盖 --ui 与 --tokenizer。

env:
  ENDPOINT_API_KEY:
    required: false
    secret: true
    description: "Bearer token。以 --api-key '${ENDPOINT_API_KEY}' 的引用形式传入，明文不进 argv、不落日志。"
  HF_TOKEN:
    required: false
    secret: true
    description: "HuggingFace 访问令牌。gated 仓库或私有语料镜像需要，公开语料与本地分词器可不填。"
  HF_ENDPOINT:
    required: false
    secret: false
    default: "https://huggingface.co"
    description: "HuggingFace 端点。内网镜像时覆盖，例如 https://hf-mirror.example.com。"
